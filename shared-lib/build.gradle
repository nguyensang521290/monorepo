plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.gnas.starter'
version = project.findProperty('versionNumber') ?: '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:3.3.4")
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.apache.commons:commons-lang3:3.14.0'

    implementation('org.springframework.boot:spring-boot-starter-actuator')
    implementation('org.springframework.boot:spring-boot-starter-aop')
    implementation('com.fasterxml.jackson.core:jackson-databind:2.20.0')
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'shared-lib'
        }
    }
    repositories {
        def nexusUrl = System.getenv('NEXUS_URL') ?: project.findProperty('nexus_url')
        if (nexusUrl) {
            maven {
                name = 'nexus'
                url = nexusUrl
                allowInsecureProtocol = true
                credentials {
                    username = project.findProperty('nexus_username')
                    password = project.findProperty('nexus_password')
                }
            }
        }
    }
}
