services:
  order-service:
    build:
      context: ..
      dockerfile: order-service/docker/Dockerfile.dev
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: order-db
      DB_USERNAME: testuser
      DB_PASSWORD: testuser
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - gnas-network

  payment-service:
    build:
      context: ..
      dockerfile: payment-service/docker/Dockerfile.dev
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payment-db
      DB_USERNAME: testuser
      DB_PASSWORD: testuser
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - gnas-network

  account-service:
    build:
      context: ..
      dockerfile: account-service/docker/Dockerfile.dev
    container_name: account-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: account-db
      DB_USERNAME: testuser
      DB_PASSWORD: testuser
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - gnas-network

networks:
  gnas-network:
    name: gnas-network