services:
  order-service:
    build:
      context: ..
      dockerfile: order-service/docker/Dockerfile.dev
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: order-db
      DB_USERNAME: testuser
      DB_PASSWORD: testuser
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      JAVA_OPTS: "-Xms256M -Xmx384M"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - gnas-network

  payment-service:
    build:
      context: ..
      dockerfile: payment-service/docker/Dockerfile.dev
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payment-db
      DB_USERNAME: testuser
      DB_PASSWORD: testuser
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      JAVA_OPTS: "-Xms256M -Xmx384M"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - gnas-network

  account-service:
    build:
      context: ..
      dockerfile: account-service/docker/Dockerfile.dev
    container_name: account-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: account-db
      DB_USERNAME: testuser
      DB_PASSWORD: testuser
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      JAVA_OPTS: "-Xms256M -Xmx384M"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - gnas-network

  identity-service:
    build:
      context: ..
      dockerfile: identity-service/docker/Dockerfile.dev
    container_name: identity-service
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: identity-db
      DB_USERNAME: testuser
      DB_PASSWORD: testuser
      JWT_SECRET: gnas-starter-secret-key-1234567890-abcdefghij
      JAVA_OPTS: "-Xms256M -Xmx384M"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gnas-network

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/docker/Dockerfile.dev
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      JAVA_OPTS: "-Xms256M -Xmx384M"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - gnas-network

networks:
  gnas-network:
    name: gnas-network
