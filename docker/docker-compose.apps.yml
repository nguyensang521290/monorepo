services:
  order-service:
    build:
      context: ..
      dockerfile: order-service/docker/Dockerfile.dev
      args:
        NEXUS_URL: ${NEXUS_URL:-http://host.docker.internal:8089/repository/maven-releases/}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: order-db
      DB_USERNAME: testuser
      DB_PASSWORD: testuser
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      JAVA_OPTS: "-Xms256M -Xmx384M"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy 
    networks:
      - gnas-network

  web:
    build:
      context: ../web
    container_name: web
    ports:
      - "6666:80"
    networks:
      - gnas-network


