services:
  nexus:
      image: sonatype/nexus3
      container_name: nexus
      ports:
        - "8089:8081"
      environment:
        - NEXUS_SECURITY_RANDOMPASSWORD=false
        - NEXUS_SECURITY_INITIAL_USER=admin
        - NEXUS_SECURITY_INITIAL_PASSWORD=password
        - INSTALL4J_ADD_VM_PARAMS=-Xms1500m -Xmx1500m -XX:MaxDirectMemorySize=1500m
      volumes:
        - nexus_data:/nexus-data
      deploy:
        resources:
          limits:
            memory: 2G
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8089/service/rest/v1/status || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s
      networks:
        - nexus-network

volumes:
  nexus_data:

networks:
  nexus-network: