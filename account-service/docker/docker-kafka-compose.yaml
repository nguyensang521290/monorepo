version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.2
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.2
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"   # host access (use localhost:9092 on mac)
      - "29092:29092" # internal network listener for containers
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-topic-creator:
    image: confluentinc/cp-kafka:7.6.2
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      '
      # wait for kafka to be available, then create topic if missing
      tries=0
      until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1 || [ $tries -ge 30 ]; do
        tries=$((tries+1))
        sleep 2
      done
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic account-opened --partitions 1 --replication-factor 1
      echo "account-opened topic ensured"
      '
    networks:
      - default
    restart: "no"

volumes:
  kafka-data:
    driver: local