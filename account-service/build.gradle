plugins {
    id 'com.gnas.starter.spring-boot-microservice'
    id "com.github.davidmc24.gradle.plugin.avro" version "1.9.1"
    id 'com.avast.gradle.docker-compose' version '0.14.2'
}

repositories {
    maven {
        url "https://packages.confluent.io/maven/"
    }
}

dependencies {
    implementation project(':shared-lib')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.kafka:spring-kafka' 
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.apache.avro:avro:1.11.3'
    implementation 'io.confluent:kafka-avro-serializer:7.5.1'

    runtimeOnly 'org.postgresql:postgresql:42.7.2'
}

avro {
    stringType = "String"
}

tasks.withType(com.github.davidmc24.gradle.plugin.avro.GenerateAvroJavaTask).configureEach {
    source("../infrastructure/kafka/schemas")
}

sourceSets {
    main {
        java {
            srcDirs += "build/generated-main-avro-java"
        }
    }
}

dockerCompose {
    useComposeFiles = [
        'docker/docker-compose.yaml',
        'docker/docker-kafka-compose.yaml'
    ]
}

tasks.register('startEnvironment') {
    dependsOn composeUp
}

tasks.register('stopEnvironment') {
    dependsOn composeDownForced
}

tasks.register('startLocal') {
    dependsOn 'startEnvironment', 'bootRun'
    finalizedBy 'stopEnvironment'
}

tasks.named('bootRun') {
    mustRunAfter 'startEnvironment'
}